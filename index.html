
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex Search</title>
  <!-- Coveo Atomic library (confirmed working CDN path, loaded as an ES module) -->
  <script type="module" src="https://static.cloud.coveo.com/atomic/v3.33.3/atomic.esm.js"></script>
  <link rel="stylesheet" href="https://static.cloud.coveo.com/atomic/v3.33.3/themes/coveo.css" />
  <!-- Cute rounded fonts for the kawaii theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ---- Kawaii palette, mapped onto Atomic's own theming variables ---- */
    /* This re-colors the native Atomic components (search box, facets,
       buttons, etc.) since these CSS variables are read across the
       shadow DOM boundary by the library itself. */
    :root {
      --atomic-primary: #ff6fa5;
      --atomic-primary-light: #ffa6cd;
      --atomic-primary-dark: #d94c85;
      --atomic-on-primary: #ffffff;
      --atomic-ring-primary: rgba(255, 111, 165, 0.35);
      --atomic-background: #fff8fb;
      --atomic-on-background: #6b4a63;
      --atomic-neutral: #ffe1ee;
      --atomic-neutral-dim: #f3c6dd;
      --atomic-neutral-light: #fff0f7;
      --atomic-neutral-lighter: #fff8fb;
      --atomic-neutral-dark: #9b7690;
      --atomic-primary-background: #ffeaf3;
      --atomic-border-radius: 1rem;
      --atomic-border-radius-md: 1.25rem;
      --atomic-border-radius-lg: 1.5rem;
      --atomic-border-radius-xl: 2rem;
      --atomic-font-family: "Quicksand", "Baloo 2", sans-serif;
    }
    body {
      margin: 0;
      font-family: "Quicksand", sans-serif;
      background: linear-gradient(160deg, #ffe6f2 0%, #f3e6ff 45%, #e6f3ff 100%);
      min-height: 100vh;
      color: #6b4a63;
    }
    header {
      background: linear-gradient(90deg, #ff8fc0 0%, #c99bff 100%);
      color: white;
      padding: 20px 28px;
      box-shadow: 0 4px 14px rgba(217, 76, 133, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-family: "Baloo 2", "Quicksand", sans-serif;
      font-size: 26px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.12);
    }
    header .sparkle {
      font-size: 26px;
    }
    .app-container {
      padding: 20px 28px 48px;
    }
    .search-row {
      margin-bottom: 20px;
    }
    .search-body {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .facets-column {
      flex: 0 0 250px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1.25rem;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(201, 155, 255, 0.18);
    }
    .results-column {
      flex: 1;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
      font-family: "Baloo 2", sans-serif;
      color: #a15c8a;
    }
  </style>
</head>
<body>
  <header>
    <span class="sparkle">🌸</span>
    <h1>Pokédex Search ✨</h1>
    <span class="sparkle">🎀</span>
  </header>
  <div class="app-container">
    <atomic-search-interface id="search">
      <div class="search-row">
        <atomic-search-box>
          <atomic-search-box-query-suggestions></atomic-search-box-query-suggestions>
          <atomic-search-box-instant-results image-size="small">
            <atomic-result-template>
              <template>
                <style>
                  .instant-poke {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                  }
                  .instant-poke img {
                    max-width: 36px;
                    max-height: 36px;
                  }
                </style>
                <div class="instant-poke">
                  <atomic-result-section-visual>
                    <atomic-field-condition if-defined="pokepic">
                      <atomic-result-image
                        field="pokepic"
                        alt="Pokémon artwork"
                      ></atomic-result-image>
                    </atomic-field-condition>
                  </atomic-result-section-visual>
                  <atomic-result-section-title>
                    <atomic-result-link>
                      <atomic-result-text field="pokename"></atomic-result-text>
                    </atomic-result-link>
                  </atomic-result-section-title>
                </div>
              </template>
            </atomic-result-template>
          </atomic-search-box-instant-results>
        </atomic-search-box>
      </div>
      <div class="search-body">
        <div class="facets-column">
          <atomic-facet-manager>
            <atomic-facet
              field="poketype"
              label="Type"
              display-values-as="checkbox"
            ></atomic-facet>
            <atomic-facet
              field="pokegen"
              label="Generation"
              display-values-as="checkbox"
            ></atomic-facet>
          </atomic-facet-manager>
        </div>
        <div class="results-column">
          <atomic-generated-answer></atomic-generated-answer>
          <div class="status-row">
            <atomic-query-summary></atomic-query-summary>
            <atomic-sort-dropdown>
              <atomic-sort-expression
                label="relevance"
                expression="relevancy"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Pokédex number"
                expression="pokedexnumber ascending"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Name (A-Z)"
                expression="pokename ascending"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Name (Z-A)"
                expression="pokename descending"
              ></atomic-sort-expression>
            </atomic-sort-dropdown>
          </div>
          <atomic-breadbox></atomic-breadbox>
          <atomic-results-per-page
            choices-displayed="12"
            initial-choice="12"
          ></atomic-results-per-page>
          <atomic-result-list
            display="grid"
            image-size="small"
            fields-to-include="pokename,poketype,pokegen,pokeheight,pokeweight,pokespecies,pokedexnumber,pokepic"
          >
            <atomic-result-template>
              <template>
                <style>
                  .poke-card {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                    padding: 16px 12px;
                    font-family: "Quicksand", sans-serif;
                    background: linear-gradient(160deg, #fff 0%, #fff0f7 100%);
                    border: 2px solid #ffd3e8;
                    border-radius: 1.25rem;
                    box-shadow: 0 4px 12px rgba(255, 143, 192, 0.2);
                    transition: transform 0.15s ease, box-shadow 0.15s ease;
                  }
                  .poke-card:hover {
                    transform: translateY(-4px);
                    box-shadow: 0 8px 18px rgba(255, 111, 165, 0.32);
                  }
                  .poke-card img {
                    max-width: 120px;
                    max-height: 120px;
                    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
                  }
                  .poke-card .poke-name {
                    font-family: "Baloo 2", sans-serif;
                    font-weight: 700;
                    font-size: 17px;
                    margin-top: 8px;
                    color: #d94c85;
                  }
                  .poke-card .poke-description {
                    font-size: 13px;
                    color: #a15c8a;
                    margin-top: 4px;
                  }
                </style>
                <div class="poke-card">
                  <atomic-result-section-visual>
                    <atomic-field-condition if-defined="pokepic">
                      <atomic-result-image
                        field="pokepic"
                        alt="Pokémon artwork"
                      ></atomic-result-image>
                    </atomic-field-condition>
                  </atomic-result-section-visual>
                  <atomic-result-section-title>
                    <atomic-result-link>
                      <span class="poke-name">
                        <atomic-result-text field="pokename"></atomic-result-text>
                        (#<atomic-result-number field="pokedexnumber"></atomic-result-number>)
                      </span>
                    </atomic-result-link>
                  </atomic-result-section-title>
                  <div class="poke-description">
                    <atomic-result-text field="pokespecies"></atomic-result-text>
                    &nbsp;•&nbsp;Height:
                    <atomic-result-text field="pokeheight"></atomic-result-text>
                    &nbsp;•&nbsp;Weight:
                    <atomic-result-text field="pokeweight"></atomic-result-text>
                  </div>
                  <atomic-result-section-bottom-metadata>
                    <atomic-result-fields-list>
                      <atomic-result-field
                        label="Type"
                        field="poketype"
                      ></atomic-result-field>
                      <atomic-result-field
                        label="Generation"
                        field="pokegen"
                      ></atomic-result-field>
                    </atomic-result-fields-list>
                  </atomic-result-section-bottom-metadata>
                </div>
              </template>
            </atomic-result-template>
          </atomic-result-list>
          <atomic-query-error></atomic-query-error>
          <atomic-no-results></atomic-no-results>
          <atomic-load-more-results></atomic-load-more-results>
        </div>
      </div>
    </atomic-search-interface>
  </div>
  <script type="module">
    (async () => {
      await customElements.whenDefined('atomic-search-interface');
      const searchInterface = document.querySelector('#search');
      await searchInterface.initialize({
        accessToken: 'xxe671c8e7-ae8d-42c9-9c04-af5ad6298406',
        organizationId: 'arielepokemonchallengew9rn4rh5'
      });
      searchInterface.executeFirstSearch();
    })();
  </script>
  <script>
    // Some Pokémon (mostly very recently added ones) don't have official
    // "large artwork" published on pokemondb yet, so the image URL we
    // computed at index time 404s. Rather than jumping straight to a
    // placeholder, first try pokemondb's "Home" sprite for the same
    // Pokémon (a smaller but real image that reliably exists even for
    // brand-new additions) and only fall back to the placeholder if that
    // fails too. Atomic's result-image renders inside nested shadow DOM
    // trees, so we recursively look through them to find every <img>.
    const POKE_PLACEHOLDER =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='56' fill='%23ffe1ee' stroke='%23ff9dc4' stroke-width='4'/%3E%3Ctext x='60' y='80' font-size='56' font-family='Baloo 2, sans-serif' font-weight='700' fill='%23ff6fa5' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E";
    function findAllImages(root, found) {
      root.querySelectorAll('img').forEach((img) => found.push(img));
      root.querySelectorAll('*').forEach((el) => {
        if (el.shadowRoot) {
          findAllImages(el.shadowRoot, found);
        }
      });
    }
    function slugFromArtworkUrl(url) {
      const match = url.match(/\/artwork\/large\/([^/]+)\.jpg(?:$|\?)/i);
      return match ? match[1] : null;
    }
    function applyImageFallback(img) {
      const stage = img.dataset.pokeFallbackStage || 'artwork';
      if (stage === 'artwork') {
        const slug = slugFromArtworkUrl(img.src);
        if (slug) {
          img.dataset.pokeFallbackStage = 'sprite';
          img.src = 'https://img.pokemondb.net/sprites/home/normal/2x/' + slug + '.jpg';
          return;
        }
      }
      img.dataset.pokeFallbackStage = 'placeholder';
      img.src = POKE_PLACEHOLDER;
    }
    function wireBrokenImageFallbacks() {
      const images = [];
      findAllImages(document, images);
      images.forEach((img) => {
        if (img.dataset.pokeFallbackStage === 'placeholder') return;
        // Catches images that already finished failing before this scan
        // ever reached them (a real-world timing gap: if the 404 resolves
        // faster than our polling interval, an "error" listener attached
        // afterward never fires, since the event already fired-and-gone).
        if (img.complete && img.naturalWidth === 0 && img.src) {
          applyImageFallback(img);
          return;
        }
        if (img.dataset.pokeFallbackWired) return;
        img.dataset.pokeFallbackWired = 'true';
        img.addEventListener('error', () => applyImageFallback(img));
      });
    }
    setInterval(wireBrokenImageFallbacks, 500);
  </script>
  <script>
    // In Atomic v3.33.3, atomic-result-text / atomic-result-number /
    // atomic-result-image render empty when used inside a *custom*
    // atomic-result-template, even though the "field" attribute is set
    // correctly in the HTML and the components are properly registered.
    // This looks like a case where the field attribute isn't triggering
    // the component's internal reactive update after it upgrades inside
    // a cloned template. As a workaround, we poll for these elements
    // (including inside nested shadow DOM, same approach as the image
    // fallback logic above) and explicitly re-assign the "field" property
    // from its attribute, which forces the component to re-run its normal
    // update/render cycle.
    function findResultFieldElements(root, found) {
      root
        .querySelectorAll('atomic-result-text, atomic-result-number, atomic-result-image')
        .forEach((el) => found.push(el));
      root.querySelectorAll('*').forEach((el) => {
        if (el.shadowRoot) {
          findResultFieldElements(el.shadowRoot, found);
        }
      });
    }
    function reviveResultFieldBindings() {
      const elements = [];
      findResultFieldElements(document, elements);
      elements.forEach((el) => {
        const fieldAttr = el.getAttribute('field');
        if (!fieldAttr) return;
        if (el.field !== fieldAttr) {
          el.field = fieldAttr;
        }
      });
    }
    setInterval(reviveResultFieldBindings, 400);
  </script>
</body>
</html>
