<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex Search</title>

  <!-- Coveo Atomic library (confirmed working CDN path, loaded as an ES module) -->
  <script type="module" src="https://static.cloud.coveo.com/atomic/latest/atomic.esm.js"></script>
  <link rel="stylesheet" href="https://static.cloud.coveo.com/atomic/latest/themes/coveo.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #2c2c54;
      color: white;
      padding: 16px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    .app-container {
      padding: 16px 24px;
    }
    .search-row {
      margin-bottom: 16px;
    }
    .search-body {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .facets-column {
      flex: 0 0 240px;
    }
    .results-column {
      flex: 1;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pokédex Search</h1>
  </header>

  <div class="app-container">
    <atomic-search-interface id="search">
      <div class="search-row">
        <atomic-search-box></atomic-search-box>
      </div>

      <div class="search-body">
        <div class="facets-column">
          <atomic-facet-manager>
            <atomic-facet
              field="poketype"
              label="Type"
              display-values-as="checkbox"
            ></atomic-facet>
            <atomic-facet
              field="pokegen"
              label="Generation"
              display-values-as="checkbox"
            ></atomic-facet>
          </atomic-facet-manager>
        </div>

        <div class="results-column">
          <div class="status-row">
            <atomic-query-summary></atomic-query-summary>
            <atomic-sort-dropdown>
              <atomic-sort-expression
                label="relevance"
                expression="relevancy"
              ></atomic-sort-expression>
              <atomic-sort-expression
                label="Pokédex number"
                expression="pokedexnumber ascending"
              ></atomic-sort-expression>
            </atomic-sort-dropdown>
          </div>

          <atomic-breadbox></atomic-breadbox>

          <atomic-result-list
            display="grid"
            image-size="small"
            fields-to-include="pokename,poketype,pokegen,pokeheight,pokeweight,pokespecies,pokedexnumber,pokepic"
          >
            <atomic-result-template>
              <template>
                <style>
                  .poke-card {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                    padding: 12px;
                  }
                  .poke-card img {
                    max-width: 120px;
                    max-height: 120px;
                  }
                  .poke-card .poke-name {
                    font-weight: bold;
                    font-size: 16px;
                    margin-top: 8px;
                  }
                </style>
                <div class="poke-card">
                  <atomic-field-condition if-defined="pokepic">
                    <atomic-result-image
                      field="pokepic"
                      alt="Pokémon artwork"
                    ></atomic-result-image>
                  </atomic-field-condition>

                  <div class="poke-name">
                    <atomic-result-text field="pokename"></atomic-result-text>
                    (#<atomic-result-number field="pokedexnumber"></atomic-result-number>)
                  </div>

                  <atomic-result-fields-list>
                    <atomic-result-field
                      label="Type"
                      field="poketype"
                    ></atomic-result-field>
                    <atomic-result-field
                      label="Generation"
                      field="pokegen"
                    ></atomic-result-field>
                    <atomic-result-field
                      label="Species"
                      field="pokespecies"
                    ></atomic-result-field>
                    <atomic-result-field
                      label="Height"
                      field="pokeheight"
                    ></atomic-result-field>
                    <atomic-result-field
                      label="Weight"
                      field="pokeweight"
                    ></atomic-result-field>
                  </atomic-result-fields-list>

                  <atomic-result-link></atomic-result-link>
                </div>
              </template>
            </atomic-result-template>
          </atomic-result-list>

          <atomic-query-error></atomic-query-error>
          <atomic-no-results></atomic-no-results>
          <atomic-load-more-results></atomic-load-more-results>
        </div>
      </div>
    </atomic-search-interface>
  </div>

  <script type="module">
    (async () => {
      await customElements.whenDefined('atomic-search-interface');
      const searchInterface = document.querySelector('#search');
      await searchInterface.initialize({
        accessToken: 'xxe671c8e7-ae8d-42c9-9c04-af5ad6298406',
        organizationId: 'arielepokemonchallengew9rn4rh5'
      });
      searchInterface.executeFirstSearch();
    })();
  </script>
</body>
</html>
